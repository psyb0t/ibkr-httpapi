title: ibkr-httpapi
tagline: Interactive Brokers over curl, JSON and MCP
description: A self-hosted HTTP and MCP API over Interactive Brokers. FastAPI and ib_async drive a local IB Gateway container for market data, account state and orders across stocks, options, futures, CFDs, forex and crypto.
lang: en
url: https://psyb0t.github.io
baseurl: /ibkr-httpapi
repository: psyb0t/ibkr-httpapi
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/ibkr-httpapi
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/ibkr-httpapi/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/ibkr-httpapi
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
